<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Scape Comparison</title>
<style>
body { font-family: Arial, sans-serif; }
.container { display: flex; flex-wrap: wrap; }
.image-row { display: flex; align-items: center; margin-bottom: 20px; width: 100% }
.image-row img { margin-right: 10px; max-width: 200px; height: auto; }
.color-square { width: 100px; height: 100px; margin-right: 10px; }
</style>
</head>
<body>
<div class="container">
<div class="image-row">
<p>yellow-blue</p>
<img src="./yellow-blue.png" alt="yellow-blue">
<img class="color-square" src="./yellow-blue_primary_output.png" alt="yellow-blue primary color">
<img class="color-square" src="./yellow-blue_secondary_output.png" alt="yellow-blue secondary color">
</div>
<div class="image-row">
<p>blue</p>
<img src="./blue.jpg" alt="blue">
<img class="color-square" src="./blue_primary_output.png" alt="blue primary color">
<img class="color-square" src="./blue_secondary_output.png" alt="blue secondary color">
</div>
<div class="image-row">
<p>pink</p>
<img src="./pink.png" alt="pink">
<img class="color-square" src="./pink_primary_output.png" alt="pink primary color">
<img class="color-square" src="./pink_secondary_output.png" alt="pink secondary color">
</div>
<div class="image-row">
<p>green-red</p>
<img src="./green-red.png" alt="green-red">
<img class="color-square" src="./green-red_primary_output.png" alt="green-red primary color">
<img class="color-square" src="./green-red_secondary_output.png" alt="green-red secondary color">
</div>
<div class="image-row">
<p>green</p>
<img src="./green.png" alt="green">
<img class="color-square" src="./green_primary_output.png" alt="green primary color">
<img class="color-square" src="./green_secondary_output.png" alt="green secondary color">
</div>
<div class="image-row">
<p>blue-2</p>
<img src="./blue-2.png" alt="blue-2">
<img class="color-square" src="./blue-2_primary_output.png" alt="blue-2 primary color">
<img class="color-square" src="./blue-2_secondary_output.png" alt="blue-2 secondary color">
</div>
<div class="image-row">
<p>lightblue-2</p>
<img src="./lightblue-2.png" alt="lightblue-2">
<img class="color-square" src="./lightblue-2_primary_output.png" alt="lightblue-2 primary color">
<img class="color-square" src="./lightblue-2_secondary_output.png" alt="lightblue-2 secondary color">
</div>
<div class="image-row">
<p>lightblue</p>
<img src="./lightblue.png" alt="lightblue">
<img class="color-square" src="./lightblue_primary_output.png" alt="lightblue primary color">
<img class="color-square" src="./lightblue_secondary_output.png" alt="lightblue secondary color">
</div>
</div>
</body>
</html>
