<select class="form-select" (change)="onSelectionChange($event)" [disabled]="disabled()">
  @for (opt of options(); track opt.value) {
    <option [value]="opt.value">
      @if (template(); as templ) {
        <ng-container [ngTemplateOutlet]="templ" [ngTemplateOutletContext]="{ $implicit: opt.value }"></ng-container>
      } @else {
        {{opt.label || opt.title || opt.value}}
      }
    </option>
  }
</select>
