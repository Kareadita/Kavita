<select [id]="id()" class="form-select {{extraClasses()}}" (change)="onSelectionChange($event)" [disabled]="disabled()" [appFormField]="formField.field()">
  @for (opt of options(); track getEnumValue(opt)) {
    @let value = getEnumValue(opt);

    <option [value]="value" [selected]="value === formField.state().value()">
      @if (template(); as templ) {
        <ng-container [ngTemplateOutlet]="templ" [ngTemplateOutletContext]="{ $implicit: value }"></ng-container>
      } @else {
        {{ getEnumLabel(opt) | titlecase }}
      }
    </option>
  }
</select>
