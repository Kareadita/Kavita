<ng-container *transloco="let t; prefix: 'book-line-overlay'">
  @if(showOverlay()) {
    <div class="overlay">

      <div class="row g-0 justify-content-between">
        @switch (mode()) {
          @case (BookLineOverlayMode.None) {
            <div class="col-auto">
              <button class="btn btn-icon btn-sm" (click)="copy()">
                <i class="fa-solid fa-copy" aria-hidden="true"></i>
                <div>{{t('copy')}}</div>
              </button>
            </div>

            @if (!hasSelectedAnnotation()) {
              <div class="col-auto">
                <button class="btn btn-icon btn-sm" (click)="switchMode(BookLineOverlayMode.Annotate)">
                  <i class="fa-solid fa-highlighter" aria-hidden="true"></i>
                  <div>{{t('annotate')}}</div>
                </button>
              </div>
            }

            <div class="col-auto">
              <button class="btn btn-icon btn-sm" (click)="switchMode(BookLineOverlayMode.Bookmark)">
                <i class="fa-solid fa-book-bookmark" aria-hidden="true"></i>
                <div>{{t('bookmark')}}</div>
              </button>
            </div>

            <div class="col-auto">
              <button class="btn btn-icon btn-sm" (click)="reset()">
                <i class="fa-solid fa-times-circle" aria-hidden="true"></i>
                <div>{{t('close')}}</div>
              </button>
            </div>
          }

          @case (BookLineOverlayMode.Annotate) {
            <!--There is no secondary rendering here, it pops up a drawer -->
          }

          @case (BookLineOverlayMode.Bookmark) {
            <form [formRoot]="formGroup">
              <div class="input-group">
                <input id="bookmark-name" class="form-control" [formField]="formGroup.name" type="text" [placeholder]="t('bookmark-label')"
                       [appFormField]="formGroup.name" aria-describedby="bookmark-name-validations">
                <button class="btn btn-primary" type="submit" id="bookmark-name-btn" (click)="createPTOC()">{{t('save')}}</button>
              </div>
              <app-validation-errors inputId="bookmark-name" [control]="formGroup.name" />
            </form>
          }
        }
      </div>


    </div>
  }
</ng-container>
