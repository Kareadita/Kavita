<ng-container *transloco="let t; prefix: 'view-bookmark-drawer'">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">
      {{t('title')}}
    </h5>
    <button type="button" class="btn-close text-reset" [attr.aria-label]="t('close')" (click)="close()"></button>
  </div>

  <div class="offcanvas-body">

    @let items = bookmarks();

    @for(item of items; track item) {

      <div class="card">
        <app-image [imageUrl]="imageService.getBookmarkedImage(item.chapterId, item.page, item.imageOffset)" [classes]="'card-img-top'" [styles]="{width: '50%', height: '50%'}" />
        <div class="card-body">
          <h5 class="card-title">{{t('page-num-label', {page: item.page})}}</h5>

          <a href="javascript:void(0);" class="card-link" (click)="goToBookmark(item)">{{t('page-num-label', {page: item.page})}}</a>
          <button class="btn btn-danger card-link" (click)="deleteBookmark(item)">
            <i class="fa fa-trash-alt" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    }
    @empty {
      <p>{{t('no-data')}}</p>
    }

  </div>
</ng-container>
