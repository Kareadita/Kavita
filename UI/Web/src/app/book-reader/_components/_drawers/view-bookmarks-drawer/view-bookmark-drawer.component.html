<ng-container *transloco="let t; prefix: 'view-bookmark-drawer'">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">
      {{t('title')}}
    </h5>
    <button type="button" class="btn-close text-reset" [attr.aria-label]="t('close')" (click)="close()"></button>
  </div>

  <div class="offcanvas-body">

    @let items = bookmarks();

    <div class="px-2 py-1">
      @for(item of items; track item) {
        <div class="card mb-2 shadow-sm border-0">
          <div class="row no-gutters h-100">
            <div class="col-3 p-0">
              <div class="h-100 bg-light d-flex align-items-center justify-content-center">
                <app-image
                  [imageUrl]="imageService.getBookmarkedImage(item.chapterId, item.page, item.imageOffset)"
                  [styles]="{width: '100%', height: '100%', objectFit: 'cover'}" />
              </div>
            </div>

            <div class="col-9 p-0">
              <div class="card-body h-100 d-flex flex-column justify-content-between py-2 px-3">
                <div class="flex-grow-1">
                  <h6 class="card-title mb-1 font-weight-bold text-white">{{t('page-num-label', {page: item.page})}}</h6>
                  @if (item.chapterTitle) {
                    <p class="card-text mb-0 text-muted small">{{item.chapterTitle}}</p>
                  }
                </div>

                <div class="d-flex justify-content-between align-items-center mt-2">
                  <button class="btn btn-success btn-sm px-3" (click)="goToBookmark(item)">
                    <i class="fa-solid fa-eye mr-1"></i>
                  </button>
                  <button class="btn btn-danger btn-sm px-2" (click)="deleteBookmark(item)">
                    <i class="fa fa-trash-alt"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
      @empty {
        <div class="text-center text-muted py-4">
          <i class="fa fa-bookmark-o fa-2x mb-2"></i>
          <p class="mb-0 text-white">{{t('no-data')}}</p>
        </div>
      }
    </div>

  </div>
</ng-container>
