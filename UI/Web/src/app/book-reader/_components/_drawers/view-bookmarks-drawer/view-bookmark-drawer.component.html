<ng-container *transloco="let t; prefix: 'view-bookmark-drawer'">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">
      {{t('title')}}
    </h5>
    <button type="button" class="btn-close text-reset" [attr.aria-label]="t('close')" (click)="close()"></button>
  </div>

  <div class="offcanvas-body">

    @let items = bookmarks();

    @for(item of items; track item) {
      <div class="mx-auto">
        <app-image [imageUrl]="imageService.getBookmarkedImage(item.chapterId, item.page, item.imageOffset)" [styles]="{width: '50%', height: '50%'}" />
        <a href="javascript:void(0);" (click)="goToBookmark(item)">Page {{item.page}}</a>
      </div>
    }
    @empty {
      <p>No bookmarks yet</p>
    }

  </div>
</ng-container>
