<span class="epub-highlight"
      #highlightSpan
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()">
  @if (showIcon()) {
    <i [class]="iconClasses()"  role="button" (click)="toggleHighlight()"></i>
  }
  <span [class]="highlightClasses()" [attr.data-highlight-color]="annotation()!.highlightColor | highlightColor" (click)="viewAnnotation()">
    <ng-content />
  </span>
</span>
