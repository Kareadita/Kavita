<div
  #container
  class="container"
  [style.height]="containerHeight()"
  [class.armed]="isArmed()"
  [class.triggered]="isTriggered()"
  aria-hidden="true"
>
  <div class="content">
    <span class="title">{{ title() }}</span>
    <div class="track">
      <div
        class="bar"
        [style.width.%]="progressPercent()"
      ></div>
    </div>
  </div>

  <div #triggerSentinel class="trigger-sentinel"></div>
</div>
