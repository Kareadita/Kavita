@let cover = coverUrl();
<button type="button" class="preview d-block position-relative mx-auto p-0 border-0 rounded-3 overflow-hidden"
        [class.with-cover]="cover" (click)="activated.emit()">
  @if (cover) {
    <app-image [imageUrl]="cover" width="100%" height="100%" objectFit="cover" />
  }
  <span class="text d-flex flex-column align-items-center gap-1 p-3 text-center">
    @if (hint()) {
      <span class="hint">{{hint()}}</span>
    }
    <span class="fw-bold">{{heading()}}</span>
    @if (subheading()) {
      <span>{{subheading()}}</span>
    }
  </span>
</button>
