<ng-container *transloco="let t; read:'user-holds'">
  <p>{{t('description')}}</p>

  <div class="table-responsive-md">
    <table class="table table-striped table-sm">
      <thead #header>
      <tr>

        <th scope="col">
          {{t('series-name-header')}}
        </th>
        <th scope="col">
          {{t('created-header')}}
        </th>
        <!-- Actions header -->
        <th scope="col"></th>
      </tr>
      </thead>
      <tbody #container>
        @for(hold of data; track hold.seriesName) {
          <tr>

            <td>
              <app-image [width]="'32px'" [height]="'32px'" [imageUrl]="imageService.getSeriesCoverImage(hold.seriesId)"></app-image>
              <a class="btn-link ms-2" href="/library/{{hold.libraryId}}/series/{{hold.seriesId}}" target="_blank">{{hold.seriesName}}</a>
            </td>
            <td>
              {{hold.createdUtc | utcToLocalTime}}
            </td>
            <td>
              <button class="btn btn-primary" (click)="removeHold(hold)">{{t('delete-label')}}</button>
            </td>
          </tr>
        } @empty {
          @if (isLoading) {
            <tr><td colspan="4" style="text-align: center;"><app-loading [loading]="isLoading"></app-loading></td></tr>
          } @else {
            <tr><td colspan="4" style="text-align: center;">{{t('no-data')}}</td></tr>
          }
        }
      </tbody>
    </table>
  </div>
</ng-container>
