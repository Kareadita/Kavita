<ng-container *transloco="let t; prefix:'change-password'">
  <app-setting-item [title]="t('password-label')"
                    [subtitle]="hasChangePasswordAbility() ? '' : t('permission-error')"
                    [canEdit]="hasChangePasswordAbility()"
                    [isEditMode]="isEditMode()" (isEditModeChange)="updateEditMode($event)"
  >
    <ng-template #view>
      <span class="col-12">•••••••••••••••</span>
    </ng-template>
    <ng-template #edit>
      @if (resetPasswordErrors().length > 0) {
        <div class="alert alert-danger" role="alert">
          @for(error of resetPasswordErrors(); track error) {
            <div>{{error}}</div>
          }
        </div>
      }

      <form [formRoot]="formGroup">
        <div class="mb-3">
          <label for="oldpass" class="form-label">{{t('current-password-label')}}</label>
          <input class="form-control custom-input" type="password" id="oldpass" [formField]="formGroup.oldPassword" autocomplete="current-password"
                 [appFormField]="formGroup.oldPassword" aria-describedby="oldpass-validations">
          <app-validation-errors inputId="oldpass" [control]="formGroup.oldPassword" />
        </div>

        <div class="mb-3">
          <label for="new-password">{{t('new-password-label')}}</label>
          <input class="form-control" type="password" id="new-password" [formField]="formGroup.password" aria-describedby="new-password-validations"
                 autocomplete="new-password"
                 [appFormField]="formGroup.password">
          <app-validation-errors inputId="new-password" [control]="formGroup.password" />
        </div>

        <div class="mb-3">
          <label for="confirm-password">{{t('confirm-password-label')}}</label>
          <input class="form-control" type="password" id="confirm-password" [formField]="formGroup.confirmPassword" aria-describedby="confirm-password-validations"
                 autocomplete="new-password"
                 [appFormField]="formGroup.confirmPassword">
          <app-validation-errors inputId="confirm-password" [control]="formGroup.confirmPassword" [messages]="{
              mismatch: t('passwords-must-match')
              }"/>
        </div>

        <div class="col-auto d-flex d-md-block justify-content-sm-center text-md-end mb-3">
          <button type="button" class="flex-fill btn btn-secondary me-2" aria-describedby="password-panel"
                  (click)="resetPasswordForm()">{{t('reset')}}</button>
          <button type="submit" class="flex-fill btn btn-primary" aria-describedby="password-panel"
                  (click)="savePasswordForm()" [disabled]="!formGroup().valid() || !(formGroup().dirty() || formGroup().touched())">{{t('save')}}</button>
        </div>
      </form>

    </ng-template>
  </app-setting-item>
</ng-container>
