<ng-container>
  <p>
    {{t('description')}}
  </p>

  <form [formGroup]="keyBindForm">
    @for (key of Object.keys(DefaultKeyBinds); track key) {
      @if (keyBindForm.get(key); as control) {
        <app-setting-item
          [title]="t('key-bind-title-' + key)"
          [subtitle]="t('key-bind-tooltip-' + key)"
          [control]="control"
          [labelId]="key + ''"
        >
          <ng-template #view>
            {{control.value.join('+')}}
          </ng-template>
          <ng-template #edit>
            <app-setting-key-bind-picker [formControlName]="key" />
          </ng-template>
        </app-setting-item>
      }
    }
  </form>

</ng-container>
