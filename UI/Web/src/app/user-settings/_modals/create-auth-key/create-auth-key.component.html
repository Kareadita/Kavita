<ng-container *transloco="let t; prefix:'create-auth-key'">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">{{t(isRotateFlow() ? 'rotate-title' : 'create-title')}}</h4>
    <button type="button" class="btn-close" [attr.aria-label]="t('close')" (click)="close()"></button>
  </div>
  <div class="modal-body scrollable-modal">
    <div class="row g-0 mb-2">
      <app-setting-item [title]="t('name-label')" [canEdit]="true" [toggleOnViewClick]="false"
                        [isEditMode]="true" [control]="formGroup.name"
                        [showEdit]="false" labelId="name" [validations]="{
                            duplicateName: t('duplicate-name-validation')
                          }">
        <ng-template #edit>
          <input id="name" type="text" autocomplete="off" [formField]="formGroup.name" class="form-control"
                 [appFormField]="formGroup.name" />
        </ng-template>
      </app-setting-item>
    </div>

    <div class="row g-0 mb-2">
      <app-setting-item [title]="t('key-length-label')" [canEdit]="true"
                        [isEditMode]="true" [control]="formGroup.keyLength" [toggleOnViewClick]="false"
                        [showEdit]="false"  labelId="key-length">
        <ng-template #edit>
          <input id="key-length" type="range" class="form-range" [formField]="formGroup.keyLength"
                 [appFormField]="formGroup.keyLength">
          <span><output for="key-length">{{t('total-key-length', {length: formGroup.keyLength().value()})}}</output></span>
        </ng-template>
      </app-setting-item>
    </div>

    <div class="row g-0 mb-2">
      <app-setting-item [title]="t('expiration-label')" [canEdit]="!formGroup.expiresUtc().disabled()"
                        [control]="formGroup.expiresUtc" labelId="expiration">
        <ng-template #view>
          @let val = formGroup.expiresUtc().value();
          @if (val === '' || val === null) {
            {{t('never')}}
          } @else {
            {{val | utcToLocalTime}}
          }
        </ng-template>
        <ng-template #edit>
          <input id="expiration" type="date" class="form-control" [formField]="formGroup.expiresUtc"
                 [appFormField]="formGroup.expiresUtc">
        </ng-template>
      </app-setting-item>
    </div>

  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">{{t('cancel')}}</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="formGroup().invalid()">{{t('save')}}</button>
  </div>
</ng-container>
