<ng-container *transloco="let t; prefix: 'manage-metadata-settings'">

  @if (licenseService.hasActiveLicense()) {
    <p class="alert alert-warning" role="alert">{{t('k+-warning')}}</p>
  }

  <div class="row g-0 mt-4 mb-4">
    <div class="col-md-6 col-sm-12">
      <app-setting-switch [title]="t('enable-extended-metadata-processing-label')" [subtitle]="t('enable-extended-metadata-processing-tooltip')"
                          [control]="formGroup.enableExtendedMetadataProcessing">
        <ng-template>
          <div class="form-check form-switch float-end">
            <input type="checkbox" class="form-check-input" [formField]="formGroup.enableExtendedMetadataProcessing">
          </div>
        </ng-template>
      </app-setting-switch>
    </div>
  </div>

  <div class="row g-0 mt-4 mb-4">
    <div class="col-md-4 col-sm-12">
      <button class="btn btn-secondary" (click)="manageMetadataMappingsComponent()?.export()">
        {{t('export-settings')}}
      </button>
      <div class="text-muted mt-2">{{t('export-tooltip')}}</div>
    </div>

    <div class="col-md-4 col-sm-12">
      <button class="btn btn-secondary" routerLink="/settings" [fragment]="SettingsTabId.MappingsImport">
        {{t('import-settings')}}
      </button>
      <div class="text-muted mt-2">{{t('import-tooltip')}}</div>
    </div>

    <div class="col-md-4 col-sm-12">
      <button class="btn btn-secondary" (click)="reRunMappings()" [disabled]="isReRunInProgress()">
        {{t('run-metadata-mappings')}}
      </button>
      <div class="text-muted mt-2">{{t('run-metadata-mappings-tooltip')}}</div>
    </div>
  </div>

  <div class="setting-section-break"></div>

  <h4 class="mb-4">{{t('tags-header')}}</h4>

  @if (settings()) {
    <app-manage-metadata-mappings [field]="formGroup.mappings" [showGenreTagToggles]="false" />
  }
</ng-container>
