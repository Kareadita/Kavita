<ng-container *transloco="let t; prefix:'edit-license-key'">
  <div class="mt-2">
    <div class="form-group mb-1">
      <label for="license-key">{{t('activate-license-label')}}</label>
      <input id="license-key" type="text" class="form-control" [formField]="formGroup.licenseKey" autocomplete="off"
             placeholder="XXXX-XXXX-XXXX-XXXX" aria-describedby="license-key-validations" aria-details="license-help-block"
             [appFormField]="formGroup.licenseKey" />

      @if (hasLicense()) {
        <div id="license-help-block" class="form-text">
          {{t('license-help')}}
        </div>
      }

      <app-validation-errors [control]="formGroup.licenseKey" inputId="license-key" [messages]="{
            required: t('required-field-validation'),
            minlength: t('license-length-validation'),
            maxlength: t('license-length-validation'),
            pattern: t('license-format-validation')
          }" />
    </div>
    <div class="form-group mb-1">
      <label for="email">{{t('activate-email-label')}}</label>
      <input id="email" type="email" class="form-control" [formField]="formGroup.email" autocomplete="off"
             placeholder="you@domain.com" aria-describedby="email-validations" aria-details="email-help-block"
             [appFormField]="formGroup.email" />
      <div id="email-help-block" class="form-text">
        {{t('email-help')}}
      </div>

      <app-validation-errors [control]="formGroup.email" inputId="email" [messages]="{
            required: t('required-field-validation'),
            email: t('email-format-validation'),
          }" />
    </div>
  </div>
</ng-container>
