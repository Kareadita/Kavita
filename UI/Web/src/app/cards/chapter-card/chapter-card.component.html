
<ng-template #title let-chapter>
  @if (chapter.isSpecial) {
    {{chapter.title || chapter.range}}
  } @else {
    <app-entity-title [entity]="chapter" [prioritizeTitleName]="false" [libraryType]="libraryType" />
  }
</ng-template>
<app-entity-card
  [entity]="cardEntity()"
  [config]="config()"
  [index]="index()"
  [maxIndex]="maxIndex()"
/>
