<ng-container *transloco="let t; prefix: 'day-breakdown'">
  <div class="dashboard-card-content">
    <h4>{{t('title')}}</h4>

    @if (hasData()) {
      <app-bar-chart
        [data]="data()"
        [axisLabels]="axisLabels()"
        [horizontal]="false"
        [showLabels]="true"
        [labelPosition]="'top'"
        [multiColor]="true"
        height="250px"
      />
    } @else {
      <p class="text-muted">{{t('no-data')}}</p>
    }
  </div>
</ng-container>
