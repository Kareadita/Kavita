<div class="main-container container-fluid">
  <ng-container *transloco="let t; prefix:'browse-annotations'" >
    <app-side-nav-companion-bar [hasFilter]="true" (filterOpen)="filterOpen.emit($event)">
      <h2 title>
        <span>{{t('title')}}</span>
      </h2>

      <h6 subtitle>{{t('annotations-count', {num: pagination().totalItems | number})}} </h6>

    </app-side-nav-companion-bar>

    <app-card-detail-layout
      [isLoading]="isLoading()"
      [items]="annotations()"
      [pagination]="pagination()"
      [trackByIdentity]="trackByIdentity"
      [jumpBarKeys]="jumpKeys()"
      [filteringDisabled]="true"
      [refresh]="refresh"
      [filterSettings]="filterSettings"
      [filterOpen]="filterOpen"
      (applyFilter)="updateFilter($event)"
    >

      <ng-template #cardItem let-item let-position="idx">
        <app-annotation-card
          [annotation]="item"
          [allowEdit]="false"
          [isInReader]="false"
          [showInReaderLink]="true"
          [showPageLink]="false"
          [openInIncognitoMode]="true"
        />
      </ng-template>

    </app-card-detail-layout>

  </ng-container>
</div>
