<ng-container *transloco="let t; prefix:'review-modal'">
  <div>
      <div class="modal-header">
          <h4 class="modal-title" id="modal-basic-title">{{t('title')}}</h4>
          <button type="button" class="btn-close" [attr.aria-label]="t('close')" (click)="close()">

          </button>
      </div>
      <div class="modal-body">
          <form [formGroup]="reviewGroup">
              <div class="row g-0 mt-2">
                @if (reviewGroup.get('reviewBody'); as formControl) {
                  <label for="review" class="form-label">{{t('review-label')}}</label>
                  <textarea id="review" class="form-control" formControlName="reviewBody" rows="3" [minlength]="minLength" [appFormField]="formControl"
                            aria-describedby="review-validations"
                  ></textarea>

                  <app-validation-errors inputId="review" [control]="formControl" />
                }
              </div>
          </form>

      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" (click)="delete()">{{t('delete')}}</button>
          <button class="btn btn-secondary" (click)="close()">{{t('close')}}</button>
          <button type="submit" class="btn btn-primary" (click)="save()">{{t('save')}}</button>
      </div>
  </div>
</ng-container>
