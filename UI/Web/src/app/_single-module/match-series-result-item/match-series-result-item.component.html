<div class="clickable" style="display: flex;padding: 5px;" (click)="selectItem()">
  <div style="width: 24px" class="me-1">
    @if (item.series.coverUrl) {
      <app-image class="me-3 search-result" width="24px" [imageUrl]="item.series.coverUrl"></app-image>
    }
  </div>
  <div class="ms-1">
    {{item.series.name}}
    @if (item.series.summary) {
      <app-read-more [text]="item.series.summary" [showToggle]="false"></app-read-more>
    }
    ({{item.matchRating | translocoPercent}})
  </div>

</div>
