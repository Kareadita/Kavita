<ng-container *transloco="let t; prefix: 'register'">
  <app-splash-container>
    <ng-container title><h2>{{t('title')}}</h2></ng-container>
    <ng-container body>
      <p>{{t('description')}}</p>
      <form [formGroup]="registerForm" (ngSubmit)="submit()">
        @if (registerForm.get('username'); as formControl) {
          <div class="mb-3 text-start">
            <label for="username" class="form-label">{{t('username-label')}}</label>
            <input id="username" class="form-control custom-input" formControlName="username" type="text" autocomplete="username"
                   [appFormField]="formControl" aria-describedby="username-validations">
            <app-validation-errors inputId="username" [control]="formControl" />
          </div>
        }

        @if (registerForm.get('email'); as formControl) {
          <div class="mb-3 text-start">
            <label for="email" class="form-label float-start">{{t('email-label')}}</label>
            <i class="fa fa-info-circle ms-1" placement="right" [ngbTooltip]="emailTooltip" role="button" tabindex="0"></i>
            <ng-template #emailTooltip>{{t('email-tooltip')}}</ng-template>
            <span class="visually-hidden" id="email-help">
              <ng-container [ngTemplateOutlet]="emailTooltip" />
            </span>
            <input class="form-control custom-input" type="email" inputmode="email" id="email" autocomplete="email" formControlName="email"
                   [appFormField]="formControl" aria-describedby="email-help email-validations">
            <app-validation-errors inputId="email" [control]="formControl" />
          </div>
        }

        @if (registerForm.get('password'); as formControl) {
          <div class="mb-3 text-start">
            <label for="password" class="form-label">Password</label>
            <i class="fa fa-info-circle ms-1" placement="right" [ngbTooltip]="passwordTooltip" role="button" tabindex="0"></i>
            <ng-template #passwordTooltip>
              {{t('password-validation')}}
            </ng-template>
            <span class="visually-hidden" id="password-help"><ng-container [ngTemplateOutlet]="passwordTooltip" /></span>
            <input id="password" class="form-control custom-input" formControlName="password" autocomplete="new-password"
                   type="password" [appFormField]="formControl" aria-describedby="password-help password-validations">
            <app-validation-errors inputId="password" [control]="formControl" [messages]="{
              minlength: t('password-validation'),
              maxlength: t('password-validation'),
              pattern: t('password-validation')
            }" />
          </div>
        }

        <div>
          <button class="btn btn-primary" type="submit" [disabled]="!registerForm.valid">{{t('register')}}</button>
        </div>
      </form>
    </ng-container>
  </app-splash-container>

</ng-container>
