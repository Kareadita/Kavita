@if (isValid()) {
  <div class="image-container {{layoutClass()}} {{emulateBookClass()}}"
       [class.center-double]="shouldRenderDouble()"
       [class.reverse]="shouldRenderDouble()"
       [style.filter]="darkness() | safeStyle">

    @if(leftImage) {
      <img alt=" "
           tabindex="0" [style.outline]="'none'"
           #image [src]="leftImage.src"
           id="image-1"
           class="{{imageFitClass()}} {{readerModeClass()}} {{showClickOverlayClass()}}">
    }

    @if (shouldRenderDouble()) {
      <img alt=" " [src]="rightImage.src"
           id="image-2"
           class="image-2 {{imageFitClass()}} {{readerModeClass()}} {{showClickOverlayClass()}}">  <!--reverse-->
    }
  </div>
}
