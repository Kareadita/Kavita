<div class="image-container {{imageFitClass()}}"
     [class.d-none]="!renderWithCanvas()"
     [style.filter]="darkness() | safeStyle">
     <canvas #content appImageZoom [zoomResetKey]="currentImageSplitPart" [zoomResetMode]="imageFitClass()" tabindex="0" [style.outline]="'none'" ondragstart="return false;" onselectstart="return false;" class="{{imageFitClass()}}"></canvas>
</div>
