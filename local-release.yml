CsprojPath: "Kavita.Common/Kavita.Common.csproj"

ParseReleaseTypes:
  HeadRef: "release/stable" # Trick the tool into thinking this is a stable release
  BranchRequirements:
    Stable:
      StartWiths: "" #Always stable

BuildFrontend:
  BuildScript: "prod"
  Path: "UI/Web"
  OutputPath: "dist/browser/"
  CopyTo: "Kavita.Server/wwwroot"
  AllowLegacyPeerDeps: true
  FullReplace: true

BuildServer:
  AppName: "Kavita"
  CsprojPath: "Kavita.Server/Kavita.Server.csproj"
  SlnPath: "Kavita.sln"
  OutputPath: "_output/"
  Rids:
    Stable: ["linux-x64", "linux-arm64", "linux-arm", "linux-musl-x64", "win-x64", "win-x86", "osx-arm64", "osx-x64"]
  RenameFiles:
    - { From: "Kavita.Server", To: "Kavita"}
    - { From: "Kavita.Server.exe", To: "Kavita.exe" }
  CopyFiles:
    - { From: "INSTALL.txt", To: "README.txt" }
    - { From: "LICENSE", To: "LICENSE.txt" }
    - { From: "Kavita.Server/config/appsettings.json", To: "config/appsettings-init.json"}
  DeletePaths: ["BuildHost-net472", "BuildHost-netcore", "bin", "config/cache-long"]
  IncludeExternalFiles:
    "linux-x64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-linux-64bit", To: "kepubify" }]
    "linux-arm64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-linux-arm64", To: "kepubify" }]
    "linux-arm": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-linux-arm", To: "kepubify" }]
    "win-x64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-windows-64bit.exe", To: "kepubify.exe"}]
    "win-x84": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-windows-324bit.exe", To: "kepubify.exe"}]
    "osx-arm64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-darwin-arm64", To: "kepubify"}]
    "osx-x64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v4.0.4/kepubify-darwin-64bit", To: "kepubify"}]

Docker:
  Disabled: true
  Load: true
  Platforms: ["linux/amd64", "linux/arm64", "linux/arm/v7"]
  Images:
    - "jvmilazz0/kavita"
  Tags:
    Stable: ["local-build-{Version}"]
