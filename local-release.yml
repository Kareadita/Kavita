CsprojPath: "Kavita.Common/Kavita.Common.csproj"

ParseReleaseTypes:
  HeadRef: "release/stable" # Trick the tool into thinking this is a stable release
  BranchRequirements:
    Stable:
      StartWiths: "" #Always stable

BuildFrontend:
  BuildScript: "prod"
  Path: "UI/Web"
  OutputPath: "dist/browser/"
  CopyTo: "Kavita.Server/wwwroot"
  AllowLegacyPeerDeps: true
  FullReplace: true

BuildServer:
  AppName: "Kavita"
  CsprojPath: "Kavita.Server/Kavita.Server.csproj"
  SlnPath: "Kavita.sln"
  OutputPath: "_output/"
  Rids:
    Stable: ["linux-x64", "linux-arm64", "linux-arm", "linux-musl-x64", "win-x64", "win-x86", "osx-arm64", "osx-x64"]
  RenameFiles:
    - { From: "Kavita.Server", To: "Kavita"}
    - { From: "Kavita.Server.exe", To: "Kavita.exe" }
  CopyFiles:
    - { From: "INSTALL.txt", To: "README.txt" }
    - { From: "LICENSE", To: "LICENSE.txt" }
    - { From: "Kavita.Server/config/appsettings.json", To: "config/appsettings-init.json"}
  DeletePaths: ["BuildHost-net472", "BuildHost-netcore", "bin", "config/cache-long"]
  IncludeExternalFiles:
    "linux-x64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v5.0.0/kepubify-linux-64bit", To: "kepubify", "Sha256": "cb77fe364f780feea8de4586600f7160c7516586c21d9a80b1504c6630389069" }]
    "linux-arm64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v5.0.0/kepubify-linux-arm64", To: "kepubify", "Sha256": "6d6b44725f3161f3fa9f364c3c7cabd810a67e90420e18c84fe9f366c80d6782" }]
    "linux-arm": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v5.0.0/kepubify-linux-arm", To: "kepubify", "Sha256": "57aa3e1a2d8e30af2ebce70e4c203889ee2b66d4b97c9d88a24b6f40b0de26a5" }]
    "win-x64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v5.0.0/kepubify-windows-64bit.exe", To: "kepubify.exe", "Sha256": "3b833ee3caceb42894cc7e44a132c29a416de180666b0e49ebf8bca42fe6995d" }]
    "win-x86": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v5.0.0/kepubify-windows-32bit.exe", To: "kepubify.exe", "Sha256": "8df1022c753423c1bab726eda567d96d0eae5c7dfece3c31b2f0817761b6b02b" }]
    "osx-arm64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v5.0.0/kepubify-darwin-arm64", To: "kepubify", "Sha256": "bd9e40cb074d84c3081b3548656eb7e17117e29e577dc805252e931aa9aae5e6" }]
    "osx-x64": [{ From: "https://github.com/pgaskin/kepubify/releases/download/v5.0.0/kepubify-darwin-64bit", To: "kepubify", "Sha256": "c007999e56f5135bd01fbb40ba888a17b08c16db9b098c7a8bfa8a1275df392d" }]

Docker:
  Disabled: true
  Load: true
  Platforms: ["linux/amd64", "linux/arm64", "linux/arm/v7"]
  Images:
    - "jvmilazz0/kavita"
  Tags:
    Stable: ["local-build-{Version}"]
